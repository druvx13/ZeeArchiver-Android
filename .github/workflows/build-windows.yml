name: Build Windows Application

# This workflow can be triggered manually from the Actions tab
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: false
        default: 'latest'
  push:
    tags:
      - 'v*'
    branches:
      - 'copilot/convert-android-to-windows-app'
      - 'main'
    paths:
      - 'ZeeArchiver/**'
      - '.github/workflows/build-windows.yml'

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
        
    - name: Display .NET version
      run: dotnet --version
      
    - name: Restore dependencies
      run: dotnet restore ZeeArchiver.sln
      
    - name: Build solution
      run: dotnet build ZeeArchiver.sln --configuration Release --no-restore
      
    - name: Publish self-contained Windows x64 executable
      run: |
        dotnet publish ZeeArchiver/ZeeArchiver.csproj `
          -c Release `
          -r win-x64 `
          --self-contained true `
          -p:PublishSingleFile=true `
          -p:PublishTrimmed=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -o ./publish/win-x64
          
    - name: Create version info
      run: |
        $version = "${{ github.event.inputs.version }}"
        if ([string]::IsNullOrEmpty($version)) {
          $version = "latest"
        }
        $commitHash = "${{ github.sha }}".Substring(0,7)
        $buildDate = Get-Date -Format "yyyy-MM-dd HH:mm"
        
        @"
        ZeeArchiver - Windows Edition
        ==============================
        Version: $version
        Commit: $commitHash
        Build Date: $buildDate
        Platform: Windows 10/11 (x64)
        
        This is a self-contained executable that includes all dependencies.
        No .NET runtime installation required.
        
        Usage:
        1. Extract ZeeArchiver.exe from the archive
        2. Run ZeeArchiver.exe
        3. Start archiving!
        
        Supported Formats:
        - Extract: 7z, ZIP, RAR, TAR, GZ, BZ2, XZ, and more
        - Create: ZIP, TAR, TAR.GZ, TAR.BZ2
        
        For more information, see README_WINDOWS.md
        "@ | Out-File -FilePath ./publish/win-x64/VERSION.txt -Encoding UTF8
        
    - name: Create archive
      run: |
        Compress-Archive -Path ./publish/win-x64/* -DestinationPath ZeeArchiver-Windows-x64.zip
        
    - name: Calculate checksums
      run: |
        $hash = Get-FileHash -Path ZeeArchiver-Windows-x64.zip -Algorithm SHA256
        "SHA256: $($hash.Hash)" | Out-File -FilePath ZeeArchiver-Windows-x64.zip.sha256 -Encoding UTF8
        Get-Content ZeeArchiver-Windows-x64.zip.sha256
        
    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: ZeeArchiver-Windows-x64
        path: |
          ZeeArchiver-Windows-x64.zip
          ZeeArchiver-Windows-x64.zip.sha256
        retention-days: 90
        
    - name: Upload standalone executable
      uses: actions/upload-artifact@v4
      with:
        name: ZeeArchiver-Windows-Executable
        path: ./publish/win-x64/ZeeArchiver.exe
        retention-days: 90

  build-info:
    runs-on: ubuntu-latest
    needs: build-windows
    
    steps:
    - name: Build Summary
      run: |
        echo "### ✅ Windows Build Complete!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Build Information:**" >> $GITHUB_STEP_SUMMARY
        echo "- Platform: Windows x64" >> $GITHUB_STEP_SUMMARY
        echo "- .NET Version: 8.0" >> $GITHUB_STEP_SUMMARY
        echo "- Build Type: Self-contained" >> $GITHUB_STEP_SUMMARY
        echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Download Artifacts:**" >> $GITHUB_STEP_SUMMARY
        echo "1. Go to the Actions tab" >> $GITHUB_STEP_SUMMARY
        echo "2. Click on this workflow run" >> $GITHUB_STEP_SUMMARY
        echo "3. Download artifacts from the bottom of the page" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Available Downloads:**" >> $GITHUB_STEP_SUMMARY
        echo "- 🗜️ **ZeeArchiver-Windows-x64.zip** - Complete package with VERSION.txt" >> $GITHUB_STEP_SUMMARY
        echo "- 📄 **ZeeArchiver-Windows-x64.zip.sha256** - Checksum for verification" >> $GITHUB_STEP_SUMMARY
        echo "- 💻 **ZeeArchiver.exe** - Standalone executable" >> $GITHUB_STEP_SUMMARY
